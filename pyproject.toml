[project]
name = "term-wyrm"
dynamic = ["version"]
description = "Unified interface for ontology search APIs (OLS, UMLS) with standardized CURIE prefixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Pretty tables for the CLI only; the library never imports Rich.
rich = ["rich>=13"]

[project.scripts]
term-wyrm = "term_wyrm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "rich>=13"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/term_wyrm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/term_wyrm"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
